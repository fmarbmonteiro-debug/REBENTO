<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rebento | Login</title>
    <link rel="manifest" href="../manifest.json" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="card auth-card">
        <h1>Entrar</h1>
        <p>Bem-vindo de volta ao teu armário de plantas.</p>

        <form id="login-form">
          <div class="auth-stack">
            <div>
              <label class="label" for="email">Email</label>
              <input id="email" name="email" class="input" type="email" placeholder="exemplo@email.com" required />
            </div>

            <div>
              <label class="label" for="password">Palavra-passe</label>
              <input id="password" name="password" class="input" type="password" placeholder="Digite a tua palavra-passe" autocomplete="current-password" required />
            </div>
          </div>

          <p id="form-error" class="form-note" role="alert" aria-live="polite"></p>
          <div class="form-actions">
            <a href="registo.html" class="helper-link">Criar conta</a>
            <button class="btn btn-primary" type="submit">Entrar</button>
          </div>
        </form>
        <p class="helper-link"><a href="menu-inicial.html">Voltar ao menu inicial</a></p>
      </section>
    </main>

    <script src="../manifest.js"></script>
    <script src="js/main.js"></script>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
